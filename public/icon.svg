<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="satGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#22c55e" stroke-width="8" stroke-opacity="0.5" />

  <!-- Orbital Ring (SAR & Satellite) -->
  <ellipse cx="256" cy="240" rx="200" ry="85" fill="none" stroke="url(#satGrad)" stroke-width="6" stroke-dasharray="16 10" transform="rotate(-25 256 240)" opacity="0.75" />

  <!-- Satellite Vector Node -->
  <g transform="translate(385, 125) rotate(20)">
    <rect x="-16" y="-16" width="32" height="32" rx="6" fill="#38bdf8" filter="url(#glow)" />
    <!-- Solar Panels -->
    <rect x="-44" y="-8" width="22" height="16" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <rect x="22" y="-8" width="22" height="16" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Agronomic Leaf & Seed Heart -->
  <g transform="translate(0, 20)">
    <!-- Central Plant Leaf -->
    <path d="M 256 380 C 256 380 160 300 160 210 C 160 140 220 100 256 100 C 292 100 352 140 352 210 C 352 300 256 380 256 380 Z" fill="url(#leafGrad)" opacity="0.9" />
    <!-- Leaf Spine & Veins -->
    <path d="M 256 120 L 256 370" stroke="#0b1329" stroke-width="6" stroke-linecap="round" opacity="0.6" />
    <path d="M 256 200 Q 220 180 190 195" fill="none" stroke="#0b1329" stroke-width="4" stroke-linecap="round" opacity="0.5" />
    <path d="M 256 240 Q 290 220 320 235" fill="none" stroke="#0b1329" stroke-width="4" stroke-linecap="round" opacity="0.5" />
    <path d="M 256 280 Q 225 265 200 280" fill="none" stroke="#0b1329" stroke-width="4" stroke-linecap="round" opacity="0.5" />

    <!-- Golden Wheat / Sprout Accent -->
    <circle cx="256" cy="180" r="18" fill="url(#goldGrad)" filter="url(#glow)" />
    <circle cx="256" cy="230" r="14" fill="url(#goldGrad)" />
  </g>

  <!-- Sub-radar Wave Emitter -->
  <circle cx="256" cy="400" r="10" fill="#22c55e" filter="url(#glow)" />
  <path d="M 226 425 A 40 40 0 0 0 286 425" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  <path d="M 206 445 A 70 70 0 0 0 306 445" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" opacity="0.5" />
</svg>
