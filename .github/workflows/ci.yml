name: Agrotech Venezuela - Continuous Integration (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/agrotech_db?schema=public"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test-nextjs:
    name: Next.js 16 WebGIS & API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Jest Test Suite (22 suites / 128 tests)
        run: npm test

      - name: Build Next.js Production App
        run: npm run build

  test-python-backend:
    name: Python Spatial, ML & Gemini Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite (51 tests)
        working-directory: ./backend
        run: python -m pytest tests


