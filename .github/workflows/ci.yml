name: Agrotech Venezuela - Continuous Integration (CI)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test-nextjs:
    name: Next.js 16 WebGIS & API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: agrotech-app/package-lock.json

      - name: Install Dependencies
        working-directory: ./agrotech-app
        run: npm ci

      - name: Run Jest Test Suite (30 tests)
        working-directory: ./agrotech-app
        run: npm test

      - name: Verify TypeScript & Build
        working-directory: ./agrotech-app
        run: |
          npx prisma generate
          npm run build

  test-python-backend:
    name: Python Spatial, ML & Gemini Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scikit-learn google-genai streamlit folium streamlit-folium plotly

      - name: Run Pytest Suite (31 tests)
        working-directory: ./backend
        run: python -m pytest tests
